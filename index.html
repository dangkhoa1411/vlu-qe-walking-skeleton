<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walking Skeleton - Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 80px; }
    form { display: flex; flex-direction: column; gap: 10px; width: 260px; }
    #message { margin-top: 12px; font-weight: bold; }
    .ok { color: green; } .fail { color: red; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Đăng nhập</h2>
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <div id="message"></div>
  </form>

  <script src="login.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const msg = document.getElementById('message');
      if (login(user, pass)) {
        msg.textContent = 'Đăng nhập thành công!';
        msg.className = 'ok';
      } else {
        msg.textContent = 'Sai tài khoản hoặc mật khẩu!';
        msg.className = 'fail';
      }
    });
  </script>
</body>
</html>
